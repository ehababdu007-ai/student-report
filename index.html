<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متابعة الطلاب - تقرير الطالب</title>
  <style>
    :root {
      --primary-color: #0b5ed7;
      --whatsapp-color: #25d366;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #e0e0e0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }
    .container { max-width: 600px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { margin: 5px 0; color: var(--primary-color); }
    .status-bar { font-size: 12px; color: #6c757d; text-align: center; margin-bottom: 15px; }
    
    #loginScreen, #appScreen, #reportScreen { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 15px; outline: none; }
    button { width: 100%; padding: 12px; background: var(--primary-color); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    
    .btn-whatsapp { background-color: var(--whatsapp-color); color: #fff; }
    .btn-copy { background-color: #0dcaf0; color: #212529; }
    .btn-back { background-color: #6c757d; }

    .search-box { position: relative; margin-bottom: 15px; }
    .student-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
    .student-card:hover { border-color: var(--primary-color); }
    .student-name { font-weight: bold; font-size: 17px; color: #111; }
    .student-info { font-size: 14px; color: #555; margin-top: 4px; }
    
    .report-header { background: #eef4ff; border-radius: 8px; padding: 15px; margin-bottom: 15px; border-right: 4px solid var(--primary-color); }
    .grade-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .grade-title { font-size: 14px; font-weight: 500; }
    .grade-val { font-weight: bold; font-size: 15px; color: #2c3e50; }
    .no-grade { color: #d9534f; font-weight: normal; }
    
    .absence-btn { display: block; text-align: center; margin: 15px 0; text-decoration: none; background-color: #d9534f; color: #fff; padding: 12px; border-radius: 8px; font-weight: bold; }
    .whatsapp-box { background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 15px; }
    .signature { text-align: center; font-weight: bold; margin-top: 15px; padding-top: 10px; border-top: 1px dashed #ccc; color: #0b5ed7; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>متابعة الطلاب</h2>
    <div class="status-bar" id="syncStatus">جاري التحقق من البيانات...</div>
  </div>

  <!-- تسجيل الدخول -->
  <div id="loginScreen">
    <div class="input-group">
      <label>كلمة المرور للوصول:</label>
      <input type="password" id="pinInput" placeholder="أدخل كلمة المرور (1234)">
    </div>
    <button onclick="checkPin()">دخول</button>
  </div>

  <!-- شاشة البحث -->
  <div id="appScreen" style="display: none;">
    <div class="search-box">
      <input type="text" id="searchInput" oninput="searchStudents()" placeholder="ابحث باسم الطالب، رقم الطالب، أو رقم ولي الأمر...">
    </div>
    <div id="resultsList"></div>
  </div>

  <!-- شاشة التقرير -->
  <div id="reportScreen" style="display: none;">
    <button class="btn-back" onclick="showAppScreen()">← العودة للبحث</button>
    <div id="reportContent"></div>

    <div class="whatsapp-box">
      <div class="input-group">
        <label>📲 رقم الهواتف للإرسال عبر واتساب:</label>
        <input type="text" id="customPhoneInput" placeholder="أدخل الرقم المراد الإرسال إليه...">
      </div>
      <button class="btn-whatsapp" onclick="sendWhatsappReport()">إرسال التقرير عبر واتساب</button>
      <button class="btn-copy" onclick="copyReportText()">📋 نسخ نص التقرير</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbw7TDCj4Mod9VkpCsoJYG5DZJR1kPBJGKyJ2UjPBa4rppuUgJScWO8-TJfn-osJpLda/exec";
  const DEFAULT_PIN = "1234";
  let studentsData = [];
  let currentStudent = null;

  function checkPin() {
    const pin = document.getElementById("pinInput").value;
    if (pin === DEFAULT_PIN) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("appScreen").style.display = "block";
      initData();
    } else {
      alert("كلمة المرور غير صحيحة!");
    }
  }

  async function initData() {
    const cached = localStorage.getItem("students_cache");
    const lastSync = localStorage.getItem("last_sync_time");

    if (cached) {
      try {
        studentsData = JSON.parse(cached);
        updateStatus("آخر مزامنة: " + (lastSync || "محلياً"));
      } catch(e) {
        localStorage.removeItem("students_cache");
      }
    } else {
      updateStatus("جاري جلب البيانات لأول مرة...");
    }

    try {
      const response = await fetch(API_URL, {
        method: "GET",
        redirect: "follow",
        headers: { "Accept": "application/json" }
      });
      
      const data = await response.json();
      if (data && data.students && Array.isArray(data.students)) {
        studentsData = data.students;
        const now = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        localStorage.setItem("students_cache", JSON.stringify(studentsData));
        localStorage.setItem("last_sync_time", now);
        updateStatus("تمت المزامنة بنجاح الساعة " + now);
        
        if (document.getElementById("searchInput").value.trim() !== "") {
          searchStudents();
        }
      }
    } catch (err) {
      console.error("Fetch Error:", err);
      if (studentsData.length > 0) {
        updateStatus("وضع أوفلاين (تعذر الاتصال بالشبكة)");
      } else {
        updateStatus("خطأ في جلب البيانات، يرجى التوصيل بالإنترنت.");
      }
    }
  }

  function updateStatus(msg) {
    document.getElementById("syncStatus").innerText = msg;
  }

  function extractDigits(val) {
    if (!val) return "";
    return String(val).replace(/\D/g, "");
  }

  function normalizeText(text) {
    if (!text) return "";
    return String(text)
      .trim()
      .toLowerCase()
      .replace(/[\u200B-\u200D\uFEFF]/g, '');
  }

  function formatExternalUrl(url) {
    if (!url) return "";
    let trimmed = String(url).trim();
    if (!trimmed || trimmed === "undefined" || trimmed === "null") return "";
    if (!trimmed.startsWith("http://") && !trimmed.startsWith("https://")) {
      return "https://" + trimmed;
    }
    return trimmed;
  }

  // دالة تحديد الدرجة القصوى بناءً على العبارة بين قوسين أو القواعد القديمة
  function calculateMaxScore(title, stage, defaultMax) {
    if (!title) return defaultMax;

    // البحث عن أي أرقام داخل أقواس هكذا (20) أو (15.5) أو ( 30 )
    const match = title.match(/\((\d+(?:\.\d+)?)\)/);
    if (match && match[1]) {
      return parseFloat(match[1]);
    }

    // تطبيق القانون القديم في حالة عدم وجود أقواس
    if (stage && stage.includes("الثالث الثانوي") && title.includes("مراجعة")) {
      return 20;
    }

    return defaultMax;
  }

  function searchStudents() {
    const rawQuery = document.getElementById("searchInput").value;
    const query = normalizeText(rawQuery);
    const queryDigits = extractDigits(rawQuery);
    const resultsContainer = document.getElementById("resultsList");
    resultsContainer.innerHTML = "";

    if (query.length < 1) return;

    if (!studentsData || studentsData.length === 0) {
      resultsContainer.innerHTML = "<div style='text-align:center; color:#d9534f; margin-top:10px;'>جاري تحميل البيانات... يرجى الانتظار ثوانٍ ثم المحاولة</div>";
      return;
    }

    const filtered = studentsData.filter(s => {
      const sName = normalizeText(s.name);
      const matchName = sName.includes(query);
      
      const sPhoneDigits = extractDigits(s.studentPhone);
      const pPhoneDigits = extractDigits(s.parentPhone);

      const matchStudentPhone = queryDigits.length >= 2 && sPhoneDigits.includes(queryDigits);
      const matchParentPhone = queryDigits.length >= 2 && pPhoneDigits.includes(queryDigits);

      return matchName || matchStudentPhone || matchParentPhone;
    });

    if (filtered.length === 0) {
      resultsContainer.innerHTML = "<div style='text-align:center; color:#777; margin-top:10px;'>لا توجد نتائج مطابقة</div>";
      return;
    }

    filtered.forEach(student => {
      const card = document.createElement("div");
      card.className = "student-card";
      card.onclick = () => renderReport(student);
      card.innerHTML = `
        <div class="student-name">${student.name}</div>
        <div class="student-info">المرحلة: ${student.stage} | المجموعة: ${student.group || "غير محددة"}</div>
      `;
      resultsContainer.appendChild(card);
    });
  }

  function renderReport(student) {
    currentStudent = student;
    document.getElementById("appScreen").style.display = "none";
    document.getElementById("reportScreen").style.display = "block";

    const defaultPhone = extractDigits(student.parentPhone || student.studentPhone);
    document.getElementById("customPhoneInput").value = defaultPhone;

    let gradesHTML = "";
    if (student.grades && Array.isArray(student.grades)) {
      student.grades.forEach(g => {
        const maxGrade = calculateMaxScore(g.title, student.stage, g.maxScore);

        const isNoGrade = g.score === "لا يوجد درجة";
        const displayScore = isNoGrade ? `<span class="no-grade">لا يوجد درجة</span>` : `${g.score} / ${maxGrade}`;
        gradesHTML += `
          <div class="grade-row">
            <span class="grade-title">${g.title}</span>
            <span class="grade-val">${displayScore}</span>
          </div>
        `;
      });
    }

    const absenceUrl = formatExternalUrl(student.profileLink);
    let absenceBtnHTML = absenceUrl ? `<a href="${absenceUrl}" target="_blank" class="absence-btn">📌 تقرير غياب الطالب</a>` : '';

    document.getElementById("reportContent").innerHTML = `
      <div class="report-header">
        <h3 style="margin:0 0 8px 0; font-size:20px;">${student.name}</h3>
        <div><strong>المرحلة:</strong> ${student.stage}</div>
        <div><strong>المجموعة:</strong> ${student.group || "غير محددة"}</div>
        <div><strong>رقم الطالب:</strong> ${student.studentPhone || "غير مسجل"}</div>
        <div><strong>رقم ولي الأمر:</strong> ${student.parentPhone || "غير مسجل"}</div>
      </div>
      
      ${absenceBtnHTML}

      <h4 style="margin-bottom:10px; border-bottom:2px solid #0b5ed7; padding-bottom:5px;">درجات الاختبارات والواجبات:</h4>
      ${gradesHTML}

      <div class="signature">مع تحيات أ. محمد شحاتة (مدرس المواد الشرعية)</div>
    `;
  }

  function buildMessageText() {
    if (!currentStudent) return "";

    let msg = `*تقرير متابعة الطالب*\n`;
    msg += `👤 *الاسم:* ${currentStudent.name}\n`;
    msg += `📚 *المرحلة:* ${currentStudent.stage}\n`;
    msg += `👥 *المجموعة:* ${currentStudent.group || 'غير محددة'}\n`;
    msg += `-----------------------------------\n`;
    msg += `📊 *تفاصيل الدرجات والواجبات:*\n\n`;

    if (currentStudent.grades && Array.isArray(currentStudent.grades)) {
      currentStudent.grades.forEach(g => {
        const maxGrade = calculateMaxScore(g.title, currentStudent.stage, g.maxScore);
        msg += `• ${g.title}: ${g.score === 'لا يوجد درجة' ? 'لا يوجد درجة' : g.score + ' / ' + maxGrade}\n`;
      });
    }

    const absenceUrl = formatExternalUrl(currentStudent.profileLink);
    if (absenceUrl) {
      msg += `\n📌 *تقرير غياب الطالب:* ${absenceUrl}\n`;
    }

    msg += `\nمع تحيات أ. محمد شحاتة (مدرس المواد الشرعية)`;
    return msg;
  }

  function sendWhatsappReport() {
    const inputPhone = document.getElementById("customPhoneInput").value.trim();
    let targetPhone = extractDigits(inputPhone);

    if (!targetPhone) {
      alert("يرجى إدخال رقم هاتف صحيح للإرسال!");
      return;
    }

    if (targetPhone.startsWith("0")) targetPhone = "2" + targetPhone;
    if (!targetPhone.startsWith("20")) targetPhone = "20" + targetPhone;

    const msgText = buildMessageText();
    const encodedMsg = encodeURIComponent(msgText);
    window.open(`https://wa.me/${targetPhone}?text=${encodedMsg}`, '_blank');
  }

  function copyReportText() {
    const msgText = buildMessageText();
    if (!msgText) return;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msgText).then(() => {
        alert("تم نسخ نص التقرير بنجاح!");
      }).catch(() => {
        fallbackCopyText(msgText);
      });
    } else {
      fallbackCopyText(msgText);
    }
  }

  function fallbackCopyText(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      alert("تم نسخ نص التقرير بنجاح!");
    } catch (err) {
      alert("عذراً، فشل النسخ التلقائي.");
    }
    document.body.removeChild(textArea);
  }

  function showAppScreen() {
    document.getElementById("reportScreen").style.display = "none";
    document.getElementById("appScreen").style.display = "block";
  }
</script>
</body>
</html>
